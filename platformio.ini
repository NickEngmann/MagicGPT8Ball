[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DARDUINOJSON_ENABLE_STD_STRING=1

; Required for WiFiManager and QMI8658
lib_deps = 
    WiFiManager@^2.0.3
    QMI8658@^1.0.0
    DEV_Config@^1.0.0
    ArduinoJson@^7.0.0

; Enable serial monitor
monitor_speed = 115200

; Optional: enable debug output
build_type = debug

[env:native]
platform = native
build_flags = -std=c99 -Wall -Wextra
test_build_src = true

[platformio]
default_envs = esp32dev, native
