name: Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: pip install pytest flask platformio
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build and run native tests
        run: |
          if [ -f Makefile ] && make test 2>/dev/null; then make test; fi
          for f in test/test_*.c; do
            [ -f "$f" ] && gcc -o /tmp/test_run "$f" -I. -lm 2>/dev/null && /tmp/test_run || true
          done
          for f in tests/test_*.c; do
            [ -f "$f" ] && gcc -o /tmp/test_run "$f" -I. -lm 2>/dev/null && /tmp/test_run || true
          done
      - name: Run Python tests
        run: pytest test/test_native/ -v || echo "No pytest tests found in test/test_native/"